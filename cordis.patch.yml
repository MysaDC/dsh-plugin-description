# dsh-plugin-description 的 bundle 补丁层。
# `dsh plugin --profile <name> add dsh-plugin-description` 安装后,
# 插件管理器会把本包追加进 dsh.profile.bundles,启动时应用此补丁插入组合行:
#   - 宿主行:Node 半提供 pluginDescriptions 服务与 GET /plugin-descriptions 数据端点;
#   - 浏览器名册:包声明 dsh.client(platform: web),Client 半把带说明的插件列表
#     注册进 设置 → 插件 的「插件列表」标签页。
- insert:
    - id: plugin-description
      name: 'dsh-plugin-description'

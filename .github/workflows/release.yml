name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号(不含 v,例如 1.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: 构建并校验组合包产物
        run: node scripts/build.mjs --verify

      - name: 打 npm tarball(dsh plugin add 的安装件)
        run: npm pack --pack-destination dist/

      - name: 生成无版本号的 latest 安装件(固定文件名,供 releases/latest/download 跳转)
        run: cp "dist/dsh-plugin-description-$(node -p "require('./package.json').version").tgz" dist/dsh-plugin-description.tgz

      - uses: actions/upload-artifact@v7
        with:
          name: plugin-description-dist
          path: |
            dist/*.tgz
            dist/package/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: plugin-description-dist
          path: dist

      - name: 解析版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # 手动触发时当前 ref 不是 tag:先按输入的版本号打 tag 并推送,
      # 后续步骤再基于该 tag 创建 Release。
      - name: 手动发布时创建并推送标签
        if: github.ref_type != 'tag'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.ver.outputs.version }}"
          git push origin "v${{ steps.ver.outputs.version }}"

      - name: 打包可安装成品(dist/package)
        run: |
          cd dist/package
          zip -r "../../dsh-plugin-description-v${{ steps.ver.outputs.version }}.zip" .

      # 源码档案不用打包:GitHub 会为每个 tag 自动附带 Source code (zip) 与 Source code (tar.gz)。

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.tgz
            dsh-plugin-description-v${{ steps.ver.outputs.version }}.zip
